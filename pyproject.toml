[project]
name = "pyatv-cast"
version = "0.1.0"
description = "Play a video file or web video on your TV over DLNA or AirPlay, converting just in time only when needed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brady Bouchard" }]
requires-python = ">=3.9"
dependencies = [
    "pyatv>=0.16",
    "srptools<2",
    "aiohttp",
    "ifaddr",
    "yt-dlp",
]

[project.urls]
Homepage = "https://github.com/bouchard/pyatv-cast"
Issues = "https://github.com/bouchard/pyatv-cast/issues"

[project.scripts]
pyatv-cast = "pyatv_cast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyatv_cast"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["pyatv_cast"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
